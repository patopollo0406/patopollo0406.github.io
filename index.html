<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Angie Alexandra 💖</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffd6e8, #fff1c1);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 0;
  text-align: center;
  overflow: hidden;
}

.card {
  background: rgba(255, 255, 255, 0.9);
  padding: 30px;
  border-radius: 25px;
  max-width: 330px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  z-index: 2;
}

img {
  width: 150px;
  margin-bottom: 15px;
}

h1 {
  font-size: 26px;
}

p {
  font-size: 16px;
  margin-bottom: 20px;
}

button {
  font-size: 16px;
  padding: 10px 20px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  margin: 10px;
}

#yes {
  background: #ff6fae;
  color: white;
}

#no {
  background: #bbb;
  color: white;
  position: absolute;
}

/* Corazones */
.heart {
  position: fixed;
  top: -10px;
  font-size: 24px;
  animation: fall 5s linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(110vh);
    opacity: 0;
  }
}
</style>
</head>

<body>

<!-- Música instrumental -->
<audio id="music" autoplay loop>
  <source src="music.m4a" type="audio/mpeg">
</audio>

<div class="card" id="card">
  <img src="snoopylove.png">

  <h1>Angie Alexandra💕</h1>

  <p>
    Mmmm... una niña coleccionista de canciones <br>
    Gracias por todo ❤️
    <br><br>
    ¿Vamos por nuestro primer San Valentín o qué?
    <br><br>
    <strong>Lugar:</strong> sorpresa,<br>
    los detalles se revelarán más adelante 😉
  </p>

  <button id="yes" onclick="sayYes()">¡Sí! 💖</button>
  <button id="no" onmouseover="moveNo()">No 😅</button>
</div>

<script>
function sayYes() {
  // Asegura que la música suene sí o sí
  document.getElementById("music").play();

  document.body.innerHTML = `
  <div style="
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg, #ffb3d9, #fff1c1);
    text-align:center;
  ">
    <img src="snoopi.gif" style="width:180px;">
    <h1>¡YAYYY! 🥰💘</h1>
    <p>
      Al darle que sí estoy sonriendo como tú al no poder darle que no.<br>
      No puedo prometer mucho, solo que las risas no faltarán ❤️
    </p>
  </div>
  `;

  startHearts();
}

function startHearts() {
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = ["💖","💗","💞","💕"][Math.floor(Math.random() * 4)];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random() * 3) + "s";
    heart.style.fontSize = (20 + Math.random() * 15) + "px";
    document.body.appendChild(heart);

    // Se eliminan para no saturar el navegador,
    // pero el efecto NUNCA se detiene
    setTimeout(() => heart.remove(), 8000);
  }, 200);
}


function moveNo() {
  const button = document.getElementById("no");
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);
  button.style.left = x + "px";
  button.style.top = y + "px";
}
</script>

</body>
</html>
