<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Angie Alexandra 💖</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffd6e8, #fff1c1);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 0;
  text-align: center;
  overflow: hidden;
}

.card {
  background: rgba(255, 255, 255, 0.9);
  padding: 30px;
  border-radius: 25px;
  max-width: 330px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  z-index: 2;
}

img {
  width: 150px;
  margin-bottom: 15px;
}

h1 {
  font-size: 26px;
}

p {
  font-size: 16px;
  margin-bottom: 20px;
}

button {
  font-size: 16px;
  padding: 10px 20px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  margin: 10px;
}

#yes {
  background: #ff6fae;
  color: white;
}

#no {
  background: #bbb;
  color: white;
  position: absolute;
}

/* Corazones */
.heart {
  position: fixed;
  top: -10px;
  font-size: 24px;
  animation: fall 5s linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(110vh);
    opacity: 0;
  }
}
</style>
</head>

<body>

<!-- AUDIO -->
<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- TARJETA PRINCIPAL -->
<div class="card" id="card">
  <img src="snoopyy.png" alt="Snoopy">

  <h1>Angie Alexandra 💕</h1>

  <p>
    Mmmm... una niña coleccionista de canciones 💫<br>
    Gracias por todo ❤️
    <br><br>
    ¿Vamos por nuestro primer San Valentín o qué?
    <br><br>
    <strong>Lugar:</strong> Sorpresa,<br>
    Los detalles se revelarán más adelante 😉
  </p>

  <button onclick="playMusic()">▶️ Reproducir música</button>
  <br><br>
  <button id="yes" onclick="sayYes()">¡Sí! 💖</button>
  <button id="no" onmouseover="moveNo()">No 😅</button>
</div>

<script>
// BOTÓN DE MÚSICA
function playMusic() {
  const music = document.getElementById("music");
  music.play();
}

// BOTÓN SÍ
function sayYes() {
  const music = document.getElementById("music");
  music.play();

  document.body.innerHTML = `
    <div style="
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg, #ffb3d9, #fff1c1);
      text-align:center;
    ">
      <img src="snooopy.gif" style="width:180px;">
      <h1>¡YAYYY! 🥰💘</h1>
      <p>
        Al darle que sí, estoy sonriendo<br>
        como tú al no poder darle que no 😌<br><br>
        No puedo prometer mucho,<br>
        solo que las risas no faltarán ❤️
      </p>
    </div>
  `;

  startHearts();
}

// CORAZONES INFINITOS
function startHearts() {
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = ["💖","💗","💞","💕","❤️"][Math.floor(Math.random() * 5)];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (18 + Math.random() * 20) + "px";
    heart.style.animationDuration = (3 + Math.random() * 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 8000);
  }, 180);
}

// BOTÓN NO ESCAPA
function moveNo() {
  const button = document.getElementById("no");
  const x = Math.random() * (window.innerWidth - 120);
  const y = Math.random() * (window.innerHeight - 60);
  button.style.left = x + "px";
  button.style.top = y + "px";
}
</script>

</body>
</html>
